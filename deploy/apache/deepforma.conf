# Managed by deploy/install.sh.
<VirtualHost *:80>
    ServerName deepforma.hephaestos.eu
    ServerAdmin webmaster@localhost
    ErrorLog /var/log/apache2/deepforma_error.log
    CustomLog /var/log/apache2/deepforma_access.log combined
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /static/ !
    Alias /static/ /opt/deepforma/app/static/
    <Directory /opt/deepforma/app/static/>
        Require all granted
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    ProxyPass / http://127.0.0.1:8001/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:8001/
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    LimitRequestBody 52428800
</VirtualHost>

# Certbot adds the HTTPS vhost and HTTP redirect after DNS validation.
