<section class="card">
  <div class="section-heading">
    <h2>Critères d'évaluation</h2>
    <span class="muted">Corriger les intitulés et statuts des critères</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Compétence</th>
          <th>Libellé</th>
          <th>Statut</th>
          <th>Provenance</th>
        </tr>
      </thead>
      <tbody>
        {% for item in criteria %}
        <tr>
          <td>{{ item.code }}</td>
          <td>{{ item.competency_code }}</td>
          <td><input type="text" name="criterion_label__{{ item.code }}" value="{{ item.criterion_label }}"></td>
          <td>
            <select name="criterion_status__{{ item.code }}">
              {% for status in ['pending', 'approved', 'corrected', 'rejected', 'excluded'] %}
              <option value="{{ status }}" {% if item.review_status == status %}selected{% endif %}>{{ status }}</option>
              {% endfor %}
            </select>
          </td>
          <td>{{ item.provenance }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
